<template v-else-if="path==='/cart'"><div class="page-heading compact"><h1>购物袋</h1><span class="heading-meta">{{cartCount}} 件商品</span></div><div v-if="!cart.length" class="empty paper"><i-icon name="bag"></i-icon><h2>购物袋还是空的</h2><p>先去发现一些值得喜欢的好物吧。</p><button class="primary" @click="go('/product/list')">开始探索 <i-icon name="arrow"></i-icon></button></div><div class="cart-layout" v-else><section class="paper cart-list"><div class="section-heading"><label><input type="checkbox" :checked="selected.length===cart.length" @change="cart.forEach(x=>x.checked=$event.target.checked)"> 全选商品</label><span>{{selected.length}} 件已选</span></div><article class="cart-item" v-for="item in cart" :key="item.key"><input type="checkbox" v-model="item.checked" :aria-label="'选择 '+item.name"><img :src="ASSETS+item.img" :alt="item.name" @click="go('/product/'+item.id)"><div><small>{{getProduct(item.id).brand}}</small><button class="item-name" @click="go('/product/'+item.id)">{{item.name}}</button><p>{{item.color}} / {{item.size}}</p><span class="tag inline" v-if="getProduct(item.id).overseas">海外直邮</span><div class="stepper"><button @click="changeQty(item,-1)" :disabled="item.qty===1" aria-label="减少商品数量">−</button><span>{{item.qty}}</span><button @click="changeQty(item,1)" :disabled="item.qty>=getProduct(item.id).stock" aria-label="增加商品数量">+</button></div></div><div class="cart-item-end"><b>{{money(item.price*item.qty)}} <small>USDT</small></b><button @click="removeCart(item.key)" aria-label="移除商品"><i-icon name="trash"></i-icon></button></div></article></section><aside class="paper summary-card"><h2>购物袋小计</h2><div class="money-row"><span>商品金额</span><b>{{money(cartTotal)}} USDT</b></div><p>运费与税费将在结算页清晰列出。</p><div class="summary-total"><span>合计</span><b>{{money(cartTotal)}}<small> USDT</small></b></div><button class="gold full" :disabled="!selected.length" @click="checkout">去结算 · {{selected.length}} 件 <i-icon name="arrow"></i-icon></button><button class="text-link full" @click="go('/product/list')">继续发现好物 →</button></aside></div></template>
<template v-else-if="path==='/checkout'"><div class="checkout-steps"><span class="done">01 购物袋</span><i-icon name="arrow"></i-icon><span class="active">02 确认订单</span><i-icon name="arrow"></i-icon><span>03 完成支付</span></div><div class="page-heading compact"><h1>确认订单</h1></div><div v-if="!checkoutItems.length" class="empty paper"><i-icon name="bag"></i-icon><h2>还没有待结算商品</h2><button class="primary" @click="go('/cart')">返回购物袋</button></div><div class="checkout-layout" v-else><div><section class="paper"><div class="section-heading"><h2><em>01</em> 收货信息</h2><button class="text-link" @click="addressModal()">＋ 新增地址</button></div><div v-if="!addresses.length" class="address-empty"><i-icon name="pin"></i-icon><p>添加一个地址，让好物找到你。</p><button class="outline" @click="addressModal()">添加收货地址</button><button class="text-link" @click="seedAddress">使用示例地址</button></div><label class="address-option" :class="{active:selectedAddress==a.id||(!selectedAddress&&a.default)}" v-for="a in addresses"><input type="radio" :value="a.id" v-model="selectedAddress"><div><b>{{a.name}}</b> <span>{{a.phone}}</span><small>{{a.country}} {{a.province}} {{a.city}} {{a.detail}}</small></div><span class="pill" v-if="a.default">默认</span></label></section><section class="paper"><div class="section-heading"><h2><em>02</em> 商品清单</h2><span>{{checkoutItems.length}} 种商品</span></div><div class="overseas-note" v-if="hasOverseas"><i-icon name="globe"></i-icon><span>包含海外直邮商品<small>过关后不可退货退款，请确认商品信息。</small></span></div><article class="checkout-item" v-for="i in checkoutItems"><img :src="ASSETS+i.img" :alt="i.name"><div><small>{{getProduct(i.id).seller}}</small><h3>{{i.name}}</h3><p>{{i.color}} / {{i.size}} × {{i.qty}}</p></div><b>{{money(i.price*i.qty)}} <small>USDT</small></b></article></section><section class="paper"><h2><em>03</em> 支付方式</h2><div class="payment-options"><label :class="{active:payMethod==='balance'}"><input type="radio" value="balance" v-model="payMethod"><i-icon name="wallet"></i-icon><span><b>站内余额支付</b><small>可用 {{money(balance)}} USDT</small></span><span class="error-text" v-if="balance<total">余额不足</span></label><label :class="{active:payMethod==='wallet'}"><input type="radio" value="wallet" v-model="payMethod"><i-icon name="globe"></i-icon><span><b>USDT 钱包直付</b><small>连接钱包，等待链上确认</small></span></label></div><div v-if="payMethod==='wallet'" class="field"><label>选择支付网络</label><select v-model="chain"><option>Ethereum · ERC20</option><option>BNB Smart Chain · BEP20</option><option>TRON · TRC20</option></select><small>设计演示网络；正式可用网络和最低金额由服务端配置返回。</small></div></section></div><aside class="paper summary-card"><h2>订单明细</h2><div class="money-row"><span>商品合计</span><b>{{money(checkTotal)}} USDT</b></div><div class="money-row"><span>运费</span><b>{{money(shipping)}} USDT</b></div><div class="money-row"><span>税费</span><b>{{money(tax)}} USDT</b></div><div class="summary-total"><span>应付金额</span><b>{{money(total)}}<small> USDT</small></b></div><label class="agreement"><input type="checkbox" v-model="agree"><span>我已阅读并同意 <button @click.prevent="modal='terms'">《用户协议》</button>与<button @click.prevent="modal='privacy'">《隐私政策》</button></span></label><button class="gold full" :disabled="busy" @click="submitOrder">{{busy?'正在提交…':payMethod==='wallet'?'提交订单并前往支付':'提交订单'}}<i-icon name="arrow"></i-icon></button><p class="demo-note"><i-icon name="shield"></i-icon>仅为本地设计体验，不发生真实付款。</p></aside></div></template>
<template v-else-if="path.startsWith('/checkout/success/')"><section class="success-view paper"><span class="success-icon"><i-icon name="check"></i-icon></span><span class="eyebrow">THANK YOU FOR CHOOSING US</span><h1>订单提交成功</h1><p>模拟支付已完成，订单已进入待发货状态。</p><div class="receipt" v-if="currentOrder"><span>订单编号</span><b>{{currentOrder.id}}</b><span>实付金额</span><b>{{money(currentOrder.total)}} USDT</b><span>订单状态</span><b>{{currentOrder.status}}</b></div><div class="button-row"><button class="primary" @click="go(currentOrder?.children?'/order':'/order/'+currentOrder?.id)">查看订单</button><button class="outline" @click="go('/')">继续逛逛</button></div></section></template>
<template v-else-if="path.startsWith('/checkout/wallet-pay/')"><section class="paper narrow" v-if="currentOrder"><span class="eyebrow">SECURE CHECKOUT</span><h1>USDT 钱包直付</h1><p>订单 {{currentOrder.id}}</p><div class="payment-amount">{{money(currentOrder.total)}} <small>USDT</small></div><div class="status-banner"><i-icon name="clock"></i-icon><span>{{currentOrder.payState}}<small>{{currentOrder.payState==='链上确认中'?'等待区块确认及平台入账，请勿重复转账。':'核对网络与金额后，发起模拟钱包支付。'}}</small></span></div><dl class="spec-table"><dt>支付网络</dt><dd>{{currentOrder.chain||'Ethereum · ERC20'}}</dd><dt>收款地址</dt><dd>设计模式 · 不提供真实收款地址</dd><dt>支付单状态</dt><dd>{{currentOrder.payState}}</dd></dl><template v-if="currentOrder.status==='待付款'"><button class="gold full" v-if="currentOrder.payState==='待支付'" @click="simulatePayment">模拟连接钱包并提交</button><template v-else><ol class="timeline"><li>钱包交易已提交</li><li class="active">链上确认中</li><li>等待平台确认付款</li></ol><button class="primary full" @click="confirmPayment">体验：平台确认到账</button></template></template><button class="outline full" @click="go(currentOrder.children?'/order':'/order/'+currentOrder.id)">查看订单状态</button><p class="demo-note">此界面保留原支付状态关系，不连接钱包、不发送交易。</p></section><div v-else class="empty"><h2>暂无待支付订单</h2><button @click="go('/order')">查看我的订单</button></div></template>
<template v-else-if="path==='/order'||path.startsWith('/order/')"><div class="customer-orders"><div class="page-heading compact"><h1>{{path==='/order'?'我的订单':'订单详情'}}</h1></div><template v-if="path==='/order'"><div class="tabs"><button v-for="s in ['全部','待付款','待发货','待收货','已完成','售后中','已取消']" :class="{active:orderTab===s}" @click="orderTab=s">{{s}}</button></div><div v-if="!orders.length" class="empty paper"><i-icon name="box"></i-icon><h2>好物旅程，从这里开始</h2><p>完成第一笔订单，或载入示例订单体验物流与售后。</p><div class="button-row"><button class="primary" @click="go('/product/list')">发现好物</button><button class="outline" @click="demoOrders">载入示例订单</button></div></div><div v-else-if="!shownOrders.length" class="empty"><h2>暂无{{orderTab}}订单</h2></div><div v-if="shownOrders.length" class="order-table-labels" aria-hidden="true"><span>商品信息</span><span>订单金额</span><span>操作</span></div><article class="paper order-card" v-for="o in shownOrders"><div class="order-head"><span>{{o.time}} <small>订单 {{o.id}}</small></span><b class="status-text">{{o.status}}</b></div><div class="order-items"><div class="checkout-item" v-for="i in o.items"><img :src="ASSETS+i.img" :alt="i.name"><div><h3>{{i.name}}</h3><p>{{i.color}} / {{i.size}} × {{i.qty}}</p></div><b>{{money(i.price*i.qty)}} USDT</b></div></div><div class="order-footer"><span>合计 <b>{{money(o.total)}} USDT</b></span><div class="button-row"><button class="outline" @click="go('/order/'+o.id)">订单详情</button><button v-if="o.status==='待付款'" class="gold" @click="orderAction(o,'pay')">继续支付</button><button v-if="o.status==='待收货'" class="outline" @click="go('/order/'+o.id)">查看物流</button><button v-if="o.status==='待收货'" class="primary" @click="form.target=o.id;modal='receive'">确认收货</button><button v-if="o.status==='已完成'" class="primary" @click="go('/review/write/'+o.id)">评价商品</button></div></div></article></template><template v-else-if="currentOrder"><section class="order-status"><i-icon :name="currentOrder.status==='已完成'?'check':'box'"></i-icon><div><h2>{{currentOrder.status}}</h2><p>{{currentOrder.status==='待付款'?'订单等待付款，请核对金额后继续。':currentOrder.status==='待收货'?'好物正在路上，期待与你相遇。':'订单最新状态已更新。'}}</p></div><button class="outline" @click="go('/im/order-group/'+currentOrder.id)">联系买手</button></section><logistics-panel v-if="currentOrder.tracking||currentOrder.status==='待收货'" :order="currentOrder" @contact="go('/im/order-group/'+currentOrder.id)"></logistics-panel><section class="paper order-detail-main"><div class="order-progress"><span :class="{active:true}">订单已创建</span><i-icon name="arrow"></i-icon><span :class="{active:currentOrder.status!=='待付款'}">付款已确认</span><i-icon name="arrow"></i-icon><span :class="{active:['待收货','已完成'].includes(currentOrder.status)}">商品已发货</span><i-icon name="arrow"></i-icon><span :class="{active:currentOrder.status==='已完成'}">确认收货</span></div><div class="info-columns"><div><h3>收货信息</h3><p>{{currentOrder.address.name}} {{currentOrder.address.phone}}<br>{{currentOrder.address.country}} {{currentOrder.address.city}} {{currentOrder.address.detail}}</p></div><div><h3>订单信息</h3><p>编号 {{currentOrder.id}}<br>{{currentOrder.time}}<br>付款状态：{{currentOrder.payState}}</p></div></div><div class="order-detail-items"><h3 class="order-block-title">商品信息</h3><div class="checkout-item" v-for="i in currentOrder.items"><img :src="ASSETS+i.img" :alt="i.name"><div><h3>{{i.name}}</h3><p>{{i.color}} / {{i.size}} × {{i.qty}}</p></div><b>{{money(i.price*i.qty)}} USDT</b></div></div><aside class="order-detail-summary"><h3 class="order-block-title">金额明细</h3><div class="money-row"><span>商品金额</span><b>{{money(currentOrder.items.reduce((sum,i)=>sum+i.price*i.qty,0))}} USDT</b></div><div class="money-row"><span>运费 / 税费</span><b>{{money(currentOrder.shipping)}} / {{money(currentOrder.tax)}} USDT</b></div><div class="money-row"><span>订单总额</span><b>{{money(currentOrder.total)}} USDT</b></div><div class="button-row end"><template v-if="currentOrder.status==='待付款'"><button class="outline" @click="modal='cancel-order'">取消订单</button><button class="gold" @click="orderAction(currentOrder,'pay')">继续支付</button></template><button class="outline" v-if="['待发货','待收货'].includes(currentOrder.status)" @click="go('/aftersale/create/'+currentOrder.id)">申请仅退款</button><button class="primary" v-if="currentOrder.status==='待收货'" @click="form.target=currentOrder.id;modal='receive'">确认收货</button><button class="primary" v-if="currentOrder.status==='已完成'" @click="go('/review/write/'+currentOrder.id)">评价商品</button></div></aside></section></template></div></template>
<template v-else-if="path==='/profile'"><section class="profile-hero"><span class="avatar large">{{user?user.name[0]:'U'}}</span><div><h1>{{user?user.name:'个人中心'}}</h1><p v-if="!user">登录后管理订单与资产</p></div><button class="gold" @click="user?modal='profile':go('/auth/login')">{{user?'编辑资料':'登录 / 注册'}}<i-icon name="arrow"></i-icon></button></section><section class="paper"><div class="section-heading"><h2>我的订单</h2><button @click="go('/order')">查看全部 →</button></div><div class="order-shortcuts"><button v-for="(s,i) in ['待付款','待发货','待收货','已完成','售后中']" @click="orderTab=s;go('/order')"><i-icon :name="['wallet','box','truck','check','return'][i]"></i-icon><span>{{s}}</span><b>{{orders.filter(o=>o.status===s).length}}</b></button></div></section><section class="profile-assets"><button @click="go('/wallet')"><span>我的可用余额</span><b>{{money(balance)}} <small>USDT</small></b><i-icon name="arrow"></i-icon></button><button @click="go('/vip')"><span>会员等级</span><b>VIP 0 </b><i-icon name="arrow"></i-icon></button><button @click="go('/points')"><span>我的积分</span><b>0 </b><i-icon name="arrow"></i-icon></button></section><profile-services :links="coreLinks" @navigate="go"></profile-services><button v-if="user" class="text-link" @click="user=null;notice('已退出体验账户')"><i-icon name="logout"></i-icon>退出登录</button></template>
<template v-else-if="path.startsWith('/auth/')"><div class="auth-layout"><section class="auth-art"><img src="assets/umaomao-meme-cat.svg" alt="Umaomao 好物生活"><div><span class="eyebrow">WELCOME TO UMAOMAO</span><h1>把世界的好物，<br>带进你的生活。</h1><p>每一次相遇，都值得期待。</p></div></section><section class="auth-form paper"><h1>{{path==='/auth/register'?'注册账户':'登录账户'}}</h1><p v-if="path==='/auth/register'">使用邮箱注册，完成后返回登录。</p><form @submit.prevent="auth"><div class="field"><label for="email">邮箱</label><input id="email" type="email" v-model="form.email" placeholder="name@example.com" required autocomplete="email"></div><div class="field" v-if="path==='/auth/register'"><label for="nickname">昵称</label><input id="nickname" v-model="form.nickname" placeholder="我们该怎么称呼你" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" v-model="form.password" placeholder="请输入 6–64 位密码" minlength="6" maxlength="64" required autocomplete="current-password"></div><div class="field" v-if="path==='/auth/register'"><label for="confirm">确认密码</label><input id="confirm" type="password" v-model="form.confirm" placeholder="请再次输入密码" required autocomplete="new-password"></div><p class="error-text" role="alert" v-if="formError">{{formError}}</p><button class="primary full" type="submit">{{path==='/auth/register'?'注册账户':'登录'}}<i-icon name="arrow"></i-icon></button></form><button class="outline full" @click="demoLogin">免填表单，进入体验账户</button><button class="text-link full" @click="modal='telegram'">使用 Telegram 登录 ↗</button><p class="center">{{path==='/auth/register'?'已有账号？':'还没有账号？'}}<button class="text-link" @click="go(path==='/auth/register'?'/auth/login':'/auth/register')">{{path==='/auth/register'?'返回登录':'立即注册'}}</button></p><small class="demo-note">本地设计体验，请勿输入真实账户密码。</small></section></div></template>
<template v-else-if="path==='/address'"><div class="page-heading compact"><h1>收货地址</h1></div><div class="section-heading"><span>{{addresses.length}} 个收货地址</span><button class="primary" @click="addressModal()">＋ 新增地址</button></div><div class="address-grid"><article class="paper address-card" v-for="a in addresses"><span class="pill" v-if="a.default">默认地址</span><h3>{{a.name}} <small>{{a.phone}}</small></h3><p>{{a.country}} {{a.province}} {{a.city}}<br>{{a.detail}}<br>{{a.postal}}</p><div class="button-row"><button @click="addressModal(a)"><i-icon name="edit"></i-icon>编辑</button><button v-if="!a.default" @click="defaultAddress(a)">设为默认</button><button @click="form.target=a.id;modal='delete-address'">删除</button></div></article><button class="add-address" @click="addressModal()"><i-icon name="plus"></i-icon>添加一个新地址</button></div><button class="text-link" v-if="!addresses.length" @click="seedAddress">填入示例地址以体验结算 →</button></template>
<template v-else-if="['/wallet','/buyer/wallet'].includes(path)"><div class="page-heading compact"><h1>我的钱包</h1></div><section class="wallet-hero"><div><span>可用余额 · USDT</span><h1>{{money(balance)}}</h1><p>≈ ¥{{money(balance*7.18)}} · 非实时参考折算</p></div><i-icon name="wallet"></i-icon><div class="button-row"><button class="gold" @click="openDeposit">转入 <i-icon name="plus"></i-icon></button><button class="outline" @click="openWithdraw">转出 <i-icon name="arrow"></i-icon></button><button @click="go('/wallet/history')">交易记录 ↗</button></div></section><div class="stats-grid"><section class="paper"><span>锁仓余额</span><h2>0.00 <small>USDT</small></h2></section><section class="paper"><span>今日支出</span><h2>{{money(orders.filter(x=>x.method==='balance').reduce((s,x)=>s+x.total,0))}} <small>USDT</small></h2></section><section class="paper"><span>资产币种</span><h2>USDT <small>稳定币</small></h2></section></div><section class="paper"><div class="section-heading"><h2>最近交易</h2><button @click="go('/wallet/history')">查看全部 →</button></div><div v-for="o in orders.filter(x=>x.method==='balance').slice(0,4)" class="transaction"><i-icon name="bag"></i-icon><span><b>商品消费</b><small>{{o.time}}</small></span><b>− {{money(o.total)}} USDT</b></div><p v-if="!orders.some(x=>x.method==='balance')" class="muted center">暂无交易。完成一笔模拟余额支付后，这里会显示收支。</p></section></template>
<template v-else-if="path==='/wallet/history'"><div class="page-heading compact"><h1>资金流水</h1></div><section class="paper"><div v-for="o in orders.filter(x=>x.method==='balance')" class="transaction"><i-icon name="bag"></i-icon><span><b>商品消费 · {{o.id}}</b><small>{{o.time}}</small></span><b>− {{money(o.total)}} USDT</b></div><div v-if="!orders.some(x=>x.method==='balance')" class="empty"><i-icon name="wallet"></i-icon><h2>暂无资金流水</h2><button class="primary" @click="go('/wallet')">返回钱包</button></div></section></template>
<template v-else-if="path==='/purchase/hall'||path==='/purchase'||path==='/buyer/claimable'"><div class="page-heading compact"><h1>{{path==='/purchase'?'我的求购':'求购大厅'}}</h1><button class="primary" @click="go('/purchase/create')">发起求购 <i-icon name="plus"></i-icon></button></div><div class="tabs"><button :class="{active:path==='/purchase/hall'}" @click="go('/purchase/hall')">求购大厅</button><button :class="{active:path==='/purchase'}" @click="go('/purchase')">我的求购</button></div><div class="request-grid"><article class="paper" v-for="r in requests"><span class="pill">{{r.status}}</span><small>{{r.cat}}</small><h2>{{r.title}}</h2><p>{{r.description}}</p><div class="money-row"><b>{{money(r.amount)}} USDT</b><span>{{r.days}} 天内发货</span></div><button class="outline full" @click="go('/purchase/'+r.id)">查看求购详情 →</button></article><div v-if="!requests.length" class="empty paper"><i-icon name="search"></i-icon><h2>期待你的第一个心愿</h2><p>还没有求购记录，告诉买手你想要什么。</p><button class="primary" @click="go('/purchase/create')">发起求购</button></div></div></template>
<template v-else-if="path==='/purchase/create'"><section class="paper narrow"><h1>发起求购</h1><form @submit.prevent="submitRequest"><div class="field"><label>商品标题 *</label><input v-model="form.title" placeholder="例如 iPhone 15 Pro 256GB 原色" required></div><div class="field"><label>商品分类 *</label><select v-model="form.cat"><option v-for="c in cats">{{c[0]}}</option></select></div><div class="field"><label>收货地址 *</label><select v-if="addresses.length" v-model="selectedAddress"><option v-for="a in addresses" :value="a.id">{{a.name}} · {{a.detail}}</option></select><button v-else type="button" class="outline" @click="addressModal()">添加收货地址</button></div><div class="form-grid"><div class="field"><label>预算 · USDT *</label><input v-model="form.amount" type="number" min="10" step="0.01" required></div><div class="field"><label>期望发货天数 *</label><input v-model="form.days" type="number" min="1" max="60" required></div></div><div class="field"><label>售后类型</label><select v-model="form.service"><option v-for="s in ['7 天无理由','店铺保修','全国联保','无售后']">{{s}}</option></select></div><label class="check-label"><input type="checkbox" v-model="form.overseas">海外直邮过关后不可退</label><div class="field"><label>求购说明 *</label><textarea v-model="form.description" minlength="10" required placeholder="至少 10 个字，说明版本、颜色、采购地区等要求"></textarea><small>{{form.description.length}} 字 / 至少 10 字</small></div><div class="field"><label>参考图片</label><input type="file" accept="image/*" multiple @change="handleFiles"><div class="upload-previews"><img v-for="f in form.files" :src="f.url" :alt="f.name"></div></div><p class="error-text" v-if="formError">{{formError}}</p><button class="gold full">提交求购 <i-icon name="arrow"></i-icon></button></form></section></template>
<template v-else-if="path.startsWith('/purchase/')"><section class="paper narrow" v-for="r in requests.filter(x=>String(x.id)===path.split('/').pop())"><span class="pill">{{r.status}}</span><h1>{{r.title}}</h1><p>{{r.description}}</p><dl class="spec-table"><dt>预算</dt><dd>{{money(r.amount)}} USDT</dd><dt>期望发货</dt><dd>{{r.days}} 天内</dd><dt>商品分类</dt><dd>{{r.cat}}</dd></dl><button class="primary full" @click="go('/im')">联系买手</button><button class="outline full" v-if="r.status==='待接单'" @click="r.status='已取消';notice('求购已取消')">取消求购</button></section></template>
<template v-else-if="path==='/aftersale'||path==='/buyer/aftersales'"><div class="page-heading compact"><h1>我的售后</h1></div><article class="paper" v-for="r in returns"><div class="section-heading"><h2>{{r.name}}</h2><span class="pill">{{r.status}}</span></div><p>{{r.reason}}</p><div class="money-row"><b>{{money(r.amount)}} USDT</b><button class="outline" @click="go('/aftersale/'+r.id)">查看进度 →</button></div></article><div v-if="!returns.length" class="empty paper"><i-icon name="shield"></i-icon><h2>暂无售后申请</h2><p>需要帮助时，可在符合条件的订单详情发起申请。</p><button class="primary" @click="go('/order')">查看订单</button></div></template>
<template v-else-if="path.startsWith('/aftersale/create/')"><section class="paper narrow"><h1>申请仅退款</h1><p>待发货或待收货订单可申请，由平台审核。</p><form @submit.prevent="submitReturn"><div class="field"><label>退款原因 *</label><textarea v-model="form.reason" required placeholder="请说明退款原因，我们会认真处理"></textarea></div><div class="field"><label>凭证图片 · 最多 6 张</label><input type="file" accept="image/*" multiple @change="handleFiles"><div class="upload-previews"><img v-for="f in form.files" :src="f.url" :alt="f.name"></div></div><p class="error-text" v-if="formError">{{formError}}</p><button class="primary full">提交仅退款申请</button></form></section></template>
<template v-else-if="path.startsWith('/aftersale/')"><section class="paper narrow" v-for="r in returns.filter(x=>String(x.id)===path.split('/').pop())"><span class="pill">{{r.status}}</span><h1>售后处理进度</h1><p>{{r.name}} · {{money(r.amount)}} USDT</p><ol class="timeline"><li class="active">申请已提交</li><li>等待平台审核</li><li>审核通过后原路退款</li></ol><p>申请原因：{{r.reason}}</p><button class="outline" @click="go('/im')">联系客服</button></section></template>
<template v-else-if="path==='/review'||path.startsWith('/review/write/')"><section class="paper" :class="path==='/review'?'my-reviews-page':'narrow'"><h1>{{title}}</h1><template v-if="path==='/review'"><div class="reviews-grid my-reviews"><review-card v-for="r in reviews" :key="r.id" :review="r" :helpful-enabled="false" @photo="openReviewPhoto"></review-card></div><div class="empty" v-if="!reviews.length"><i-icon name="star"></i-icon><h2>分享你的使用感受</h2><p>订单完成后，即可评价商品。</p><button class="primary" @click="go('/order')">查看订单</button></div></template><form v-else @submit.prevent="submitReview"><div class="star-picker"><button type="button" v-for="i in 5" @click="form.rating=i" :class="{active:form.rating>=i}" :aria-label="i+' 星'">★</button></div><div class="field"><label>你的使用感受</label><textarea v-model="form.description" minlength="5" required placeholder="分享外观、品质或使用体验"></textarea></div><p class="error-text" v-if="formError">{{formError}}</p><button class="primary full">发布评价</button></form></section></template>
<template v-else-if="path==='/im'||path.startsWith('/im/')||path==='/ai-guide'"><section class="paper chat-panel"><div class="section-heading"><div><h2>{{path==='/ai-guide'?'好物选购助手':path.startsWith('/im/order-group')?'订单三方群':'Umaomao 服务中心'}}</h2><small>本地对话体验 · 不发送给真实客服</small></div><i-icon name="headset"></i-icon></div><div class="chat-messages"><div v-for="m in messages" :class="['message',{me:m.me}]"><span class="avatar">{{m.me?'我':'U'}}</span><p>{{m.text}}</p></div></div><div class="chat-quick"><button v-for="s in ['如何支付？','物流查询','退款规则']" @click="chatInput=s;sendChat()">{{s}}</button></div><form class="chat-compose" @submit.prevent="sendChat"><input v-model="chatInput" placeholder="输入想咨询的内容" aria-label="消息内容"><button class="primary">发送 <i-icon name="arrow"></i-icon></button></form></section></template>
<template v-else-if="path==='/help'"><div class="page-heading compact help-heading"><h1>帮助中心</h1><button class="text-link" @click="go('/im')"><i-icon name="headset"></i-icon>联系客服</button></div><div class="help-layout"><aside class="paper"><h3>帮助主题</h3><button v-for="(q,i) in faqs" @click="faq=i" :class="{active:faq===i}">{{['购物指南','支付说明','配送与售后','退款流程','求购指南','钱包支付','买手入驻'][i]}}<i-icon name="chevron"></i-icon></button><button @click="modal='terms'">用户协议 ↗</button><button @click="modal='privacy'">隐私政策 ↗</button><button @click="modal='aml'">AML 政策 ↗</button></aside><section><article class="faq" v-for="(q,i) in faqs"><button :aria-expanded="faq===i" @click="faq=faq===i?-1:i"><span>{{q[0]}}</span><i-icon :name="faq===i?'minus':'plus'"></i-icon></button><div v-if="faq===i"><p>{{q[1]}}</p></div></article></section></div></template>
<template v-else-if="path==='/notifications'||path==='/announcement'"><div class="page-heading compact"><h1>{{title}}</h1></div><section class="paper"><article class="notice-item"><i-icon name="bell"></i-icon><div><h3>欢迎体验 Umaomao 全新设计</h3><p>这是本地交互原型，商品与账户状态仅用于界面体验。</p><small>2026.10.08</small></div><button @click="notice('已标记为已读')">标记已读</button></article><article class="notice-item" v-for="o in orders"><i-icon name="box"></i-icon><div><h3>订单状态已更新：{{o.status}}</h3><p>订单 {{o.id}}</p></div><button @click="go('/order/'+o.id)">查看 →</button></article></section></template>
<template v-else-if="path==='/buyer/dashboard'"><section class="profile-hero"><span class="avatar large"><i-icon name="bag"></i-icon></span><div><span class="eyebrow">BUYER STUDIO</span><h1>用你的眼光，连接好生活。</h1><p>买手工作台 · 设计预览</p></div><button class="gold" @click="go('/buyer/products/create')">发布商品 ＋</button></section><div class="stats-grid"><section class="paper" v-for="n in ['待处理订单','待处理售后','在售商品']"><span>{{n}}</span><h1>0</h1></section></div><section class="paper"><h2>买手服务</h2><div class="service-grid"><button v-for="l in buyerLinks" @click="go(l[2])"><i-icon :name="l[1]"></i-icon><span>{{l[0]}}</span><i-icon name="chevron"></i-icon></button></div></section><div class="status-banner"><i-icon name="shield"></i-icon><span>买手身份由平台审核<small>此工作台展示交互布局，不代表体验账户获得了真实买手权限。</small></span></div></template>
<template v-else-if="['/buyer/products','/buyer/orders'].includes(path)"><div class="page-heading compact"><h1>{{title}}</h1></div><section class="paper"><div class="section-heading"><input class="table-search" placeholder="搜索名称或订单编号" v-model="form.title" aria-label="搜索记录"><button v-if="path==='/buyer/products'" class="primary" @click="go('/buyer/products/create')">＋ 发布商品</button></div><div class="empty"><i-icon name="box"></i-icon><h2>暂无{{path==='/buyer/products'?'已发布商品':'买手订单'}}</h2><p>正式数据需接入现有买手接口，并校验买手身份。</p></div></section></template>
<template v-else-if="path==='/vip'||path==='/points'"><div class="page-heading compact"><h1>{{path==='/vip'?'VIP 特权':'我的积分'}}</h1><span class="heading-meta">{{path==='/vip'?'VIP 0':'当前积分 0'}}</span></div><section class="paper"><h2>{{path==='/vip'?'会员等级与权益':'积分明细'}}</h2><div class="status-banner"><i-icon name="shield"></i-icon><span>权益以平台配置为准<small>不预设折扣、收益或积分阈值。正式等级与升级规则由现有接口返回。</small></span></div><button class="outline" @click="go(path==='/vip'?'/points':'/vip')">{{path==='/vip'?'查看积分明细':'查看 VIP 权益'}} →</button></section></template>
<template v-else-if="path.startsWith('/finance')"><vault-workspace :path="path" :route="route" :balance="balance" :user="user" @go="go" @notice="notice" @update:balance="balance=$event" @login="modal='login'"></vault-workspace></template>
<template v-else-if="path==='/buyer/deposit'"><section class="paper narrow"><h1>买手押金</h1><div class="payment-amount">0.00 <small>USDT</small></div><div class="status-banner"><i-icon name="shield"></i-icon><span>押金规则待平台配置<small>所需金额、可退条件与冻结状态由接口返回。</small></span></div><button class="outline full" @click="go('/buyer/dashboard')">返回买手中心</button></section></template>
<template v-else-if="path==='/profile/pay-password'||path==='/profile/login-password'"><section class="paper narrow"><h1>{{title}}</h1><p>仅体验表单校验，请勿输入真实密码。</p><form @submit.prevent="form.password!==form.confirm?formError='两次密码不一致':notice('密码校验通过；原型不保存密码')"><div class="field"><label>新密码</label><input v-model="form.password" type="password" minlength="6" maxlength="64" required autocomplete="new-password"></div><div class="field"><label>确认新密码</label><input v-model="form.confirm" type="password" required autocomplete="new-password"></div><p class="error-text" v-if="formError">{{formError}}</p><button class="primary full">确认设置</button></form><button class="text-link full" @click="go(path.endsWith('pay-password')?'/profile/login-password':'/profile/pay-password')">{{path.endsWith('pay-password')?'设置登录密码':'设置支付密码'}} →</button></section></template>
<template v-else-if="path==='/design'"><div class="page-heading compact"><h1>页面总览</h1></div><div class="design-links"><button v-for="(t,p) in titles" @click="go(p)"><span>{{t}}</span><code>{{p}}</code><i-icon name="arrow"></i-icon></button></div><section class="paper"><h2>体验辅助</h2><div class="button-row"><button class="outline" @click="demoLogin">登录体验账户</button><button class="outline" @click="demoOrders">载入物流 / 评价示例订单</button><button class="outline" @click="seedAddress">添加示例地址</button><button class="outline" @click="modal='reset'">重置本地体验数据</button></div><p>当前为 Vue 3 本地原型。所有申请与交易均为本地演示，正式规则必须以现有电商服务端为准。</p></section></template>
<template v-else><section class="paper narrow"><h1>{{title}}</h1><template v-if="submissions[path]"><div class="status-banner"><i-icon name="clock"></i-icon><span>{{submissions[path].status}}<small>{{submissions[path].time}} · 本地模拟申请</small></span></div><p>申请已保存，请等待平台审核。此原型不会向实际接口提交资料。</p><button class="outline" @click="delete submissions[path]">体验：重新编辑</button></template><form v-else @submit.prevent="saveGeneric"><p>{{path==='/kyc'?'仅展示认证流程，不应在原型填写真实证件信息。':'填写资料后提交，由平台审核。请使用示例信息体验。'}}</p><div class="field"><label>{{path.includes('products')?'商品标题':path.includes('categories')?'分类名称':path.includes('flash-sales')?'商品名称':'姓名'}} *</label><input v-model="form.name" required placeholder="请输入示例信息"></div><div class="field" v-if="path==='/kyc'"><label>国籍</label><input v-model="form.nationality"><label>证件类型</label><select v-model="form.document"><option>身份证</option><option>护照</option></select><label>证件号码（演示）</label><input v-model="form.code" required placeholder="示例编号，不填写真实证件"></div><div class="field" v-if="path.includes('products')"><label>商品分类</label><select v-model="form.cat"><option v-for="c in cats">{{c[0]}}</option></select><label>售价 · USDT</label><input v-model="form.amount" type="number" min="0.01" step="0.01" required></div><div class="field" v-if="path==='/buyer/apply'"><label>联系方式 *</label><input v-model="form.phone" required placeholder="示例联系方式"></div><div class="field"><label>{{path==='/kyc'?'资料说明':'申请 / 商品说明'}} *</label><textarea v-model="form.description" minlength="10" required placeholder="至少填写 10 个字"></textarea></div><div class="field"><label>{{path==='/kyc'?'证件资料页（仅示例图片）':'参考图片（可选）'}}</label><input type="file" accept="image/png,image/jpeg,image/webp" @change="handleFiles" :required="path==='/kyc'"><div class="upload-previews"><img v-for="f in form.files" :src="f.url" :alt="f.name"></div></div><p class="error-text" v-if="formError">{{formError}}</p><button class="primary full">提交{{path.includes('products')?'商品':'申请'}}<i-icon name="arrow"></i-icon></button></form></section></template>
</template>
</main>
<footer class="footer"><div class="wrap"><div class="footer-callout"><i-icon name="globe"></i-icon><span>有 U，自在买。<small>用 USDT，连接你与全球好物。</small></span><button @click="go('/help?topic=pay')">了解支付流程 <i-icon name="arrow"></i-icon></button></div><div class="footer-links"><div class="footer-brand"><a href="#/" class="logo" aria-label="Umaomao 首页"><picture class="brand-art"><source media="(max-width:700px)" :srcset="currentUiTheme==='web3-meme'?'assets/umaomao-meme-cat.svg':'assets/umaomao-cat-head.svg'"><img :src="currentUiTheme==='web3-meme'?'assets/umaomao-meme-wordmark.svg':'assets/umaomao-cat-swiss-wordmark.svg'" alt="Umaomao" width="840" height="140" decoding="async"></picture></a><p>全球好物 / 用 U 探索<br>把喜欢，融入日常。</p><span>GOOD FINDS. BETTER DAYS.</span></div><div v-for="g in [{t:'购物指南',l:[['注册与登录','/auth/login'],['全部商品','/product/list'],['发起求购','/purchase/create']]},{t:'支付与配送',l:[['支付说明','/help'],['我的钱包','/wallet'],['订单追踪','/order']]},{t:'售后服务',l:[['退换政策','/help'],['我的售后','/aftersale'],['联系买手','/im']]},{t:'关于 Umaomao',l:[['帮助中心','/help'],['平台公告','/announcement'],['买手入驻','/buyer/apply']]}]"><h4>{{g.t}}</h4><button v-for="l in g.l" @click="go(l[1])">{{l[0]}}</button></div></div><mobile-footer-nav :route="route" @navigate="go"></mobile-footer-nav><div class="footer-bottom"><span>© 2026 Umaomao · 交互设计原型</span><div><button @click="modal='terms'">用户协议</button><button @click="modal='privacy'">隐私政策</button><button @click="modal='aml'">AML 政策</button><button @click="go('/design')">页面总览 ↗</button></div></div></div></footer>
<nav class="mobile-nav" :aria-label="buyerWorkspaceActive?'买手工作台导航':'手机主导航'"><button v-for="l in buyerWorkspaceActive?[['工作台','grid','/buyer/dashboard'],['商品','bag','/buyer/products'],['订单','box','/buyer/orders'],['接单','search','/buyer/claimable'],['钱包','wallet','/buyer/wallet']]:[['首页','home','/'],['分类','grid','/category'],['求购','search','/purchase/hall'],['购物袋','bag','/cart'],['我的','user','/profile']]" :class="{active:path===l[2]}" @click="go(l[2])"><span><i-icon :name="l[1]"></i-icon><b v-if="l[2]==='/cart'&&cartCount">{{cartCount}}</b></span>{{l[0]}}</button></nav>
<div class="floating-tools"><button @click="go('/im')" aria-label="联系客服"><i-icon name="headset"></i-icon></button><button @click="go('/design')" aria-label="页面总览"><i-icon name="grid"></i-icon></button><button @click="go(route)" aria-label="回到顶部">↑</button></div>
<transition name="toast"><div class="toast-message" v-if="toast" role="status"><i-icon name="check"></i-icon>{{toast}}</div></transition>
<div class="zoom-overlay" v-if="zoom" @click="zoom=false"><button class="icon-btn" aria-label="关闭大图"><i-icon name="close"></i-icon></button><img :src="ASSETS+(product.gallery||[product.img])[photo]" :alt="product.name"></div>
<transition name="modal"><div class="modal-overlay" :class="{'account-menu-overlay':modal==='account-menu'}" v-if="modal" @click.self="modal=''"><section class="dialog" :class="{'deposit-dialog':modal==='deposit','wallet-operation-dialog':['deposit','withdraw'].includes(modal),'review-photo-dialog':modal==='review-photo','account-menu-dialog':modal==='account-menu'}" role="dialog" aria-modal="true" :aria-label="modal==='account-menu'?'账户功能与身份切换':modal==='review-photo'?'评价配图':modal==='deposit'?'钱包转入':modal==='withdraw'?'钱包转出':modal==='address'?'收货地址':'操作对话框'"><div class="meme-sheet-grip" aria-hidden="true"></div><button class="dialog-close icon-btn" @click="modal=''" aria-label="关闭对话框"><i-icon name="close"></i-icon></button>

'heart','/favorites'],['我的钱包','wallet','/wallet'],['收货地址','pin','/address'],['我的求购','search','/purchase'],['帮助中心','headset','/help']]" :key="l[2]" @click="go(l[2])"><span><i-icon :name="l[1]"></i-icon></span>{{l[0]}}</button></div><button class="menu-center-link" @click="go(accountRole==='buyer'?'/buyer/dashboard':'/profile')">{{accountRole==='buyer'?'进入买手中心':'进入个人中心'}}<i-icon name="arrow"></i-icon></button><div class="menu-account-footer"><button @click="go('/im')"><i-icon name="chat"></i-icon>联系支持</button><button v-if="user" @click="user=null;modal='';notice('已退出体验账户')"><i-icon name="logout"></i-icon>退出登录</button><span v-else>好物，无界。</span></div></div></template><template v-else-if="modal==='review-photo'"><span class="eyebrow">REVIEW PHOTO</span><h2>{{form.reviewPhoto?.name}} 的评价配图</h2><img class="review-photo-full" :src="'assets/'+form.reviewPhoto?.src" alt="评价示例配图放大"><p class="demo-note">设计示例配图 · 非真实买家上传</p></template><template v-else-if="modal==='deposit'"><div class="deposit-heading"><h2>转入 · 链上充值</h2><p>选择币种与网络，安心管理每一笔充值。</p></div><div class="coin-tabs" role="group" aria-label="快捷选择币种"><button v-for="coin in ['USDC','USDT']" :class="{active:deposit.currency===coin}" :aria-pressed="deposit.currency===coin" @click="deposit.currency=coin"><span class="coin-icon" :class="coin.toLowerCase()">{{coin==='USDC'?'$':'₮'}}</span>{{coin}}</button></div><section class="deposit-panel"><template v-if="deposit.view==='form'"><div class="deposit-selectors"><label for="deposit-currency">货币<select id="deposit-currency" v-model="deposit.currency"><option>USDC</option><option>USDT</option></select></label><label for="deposit-network">网络<select id="deposit-network" v-model="deposit.network"><option v-for="network in depositNetworks[deposit.currency]">{{network}}</option></select></label></div><div class="deposit-subline"><span>充值至 {{deposit.currency}} 钱包</span><button @click="deposit.view='records'">充值记录 <i-icon name="chevron"></i-icon></button></div><div class="deposit-methods" role="group" aria-label="充值方式"><span :style="{transform:'translateX('+(['address','wallet','amount'].indexOf(deposit.method)*100)+'%)'}"></span><button v-for="(label,key) in {address:'地址充值',wallet:'钱包充值',amount:'金额充值'}" :aria-pressed="deposit.method===key" :class="{active:deposit.method===key}" @click="deposit.method=key">{{label}}</button></div><div class="deposit-content" :key="deposit.method"><template v-if="deposit.method==='address'"><div class="deposit-qr" role="img" :aria-label="deposit.currency+' / '+deposit.network+' 演示二维码，不可转账'" v-html="depositQR"></div><div class="deposit-address"><span>充值地址 · {{deposit.network}}<strong>{{depositAddress}}</strong></span><button @click="copyDeposit" aria-label="复制演示充值地址"><i-icon name="box"></i-icon>复制</button></div><div class="deposit-hint"><i-icon name="shield"></i-icon><span>币种与网络需保持一致<small>地址充值无需创建申报，到账后以平台确认为准。</small></span></div></template><template v-else><div class="deposit-wallet-visual"><i-icon :name="deposit.method==='wallet'?'wallet':'edit'"></i-icon><h3>{{deposit.method==='wallet'?'从你的钱包，直接充值':'提前登记本次充值'}}</h3><p>{{deposit.method==='wallet'?'连接钱包后，核对币种、网络与金额。':'创建金额申报后，仍需向对应地址完成转账。'}}</p></div><button class="deposit-connect" v-if="deposit.method==='wallet'" :disabled="deposit.walletConnected" @click="deposit.walletConnected=true"><i-icon :name="deposit.walletConnected?'check':'wallet'"></i-icon>{{deposit.walletConnected?'演示钱包已连接 · '+deposit.network:'连接演示钱包'}}</button><form @submit.prevent="createDeposit"><label class="deposit-amount" for="deposit-amount">充值金额 <span>{{deposit.currency}}</span><input id="deposit-amount" inputmode="decimal" v-model="deposit.amount" placeholder="0.00" autocomplete="off" :disabled="!!pendingDeposit"></label><p class="deposit-pending" v-if="pendingDeposit"><i-icon name="clock"></i-icon>已有{{pendingDeposit.status}}记录，请先核对进度。</p><button class="deposit-submit full" type="submit">{{pendingDeposit?'查看原充值记录':deposit.method==='wallet'?'模拟发起充值':'创建充值申报'}}<i-icon name="arrow"></i-icon></button></form></template><p class="deposit-error" role="alert" v-if="deposit.error">{{deposit.error}}</p></div></template><template v-else><div class="deposit-record-heading"><button @click="deposit.view='form'"><i-icon name="arrow"></i-icon>返回充值</button><h3>充值记录</h3></div><div class="deposit-empty" v-if="!depositRecords.length"><i-icon name="clock"></i-icon><h3>还没有充值记录</h3><p>金额申报与钱包充值进度会显示在这里。</p></div><article class="deposit-record" v-for="record in depositRecords" :key="record.id"><div><strong>{{record.amount}} {{record.currency}}</strong><span>{{record.status}}</span></div><p>{{record.network}} · {{record.method==='wallet'?'钱包充值':'金额申报'}}</p><small>{{record.time}}<br>{{record.id}}</small><button v-if="record.status==='待到账'" @click="record.status='已取消';notice('充值申报已取消')">取消申报</button><p v-if="record.status==='链上确认中'" class="deposit-record-note">演示待确认状态，不会自动增加余额。</p></article></template></section><p class="deposit-demo"><span></span>设计演示 · 二维码与地址不可用于转账</p></template>

</section></div></transition>
</div></div><noscript>请开启 JavaScript 以体验 Umaomao 交互设计。</noscript><script>
// QA-only wrapper. Original HTML/scripts/assets stay unchanged at their source.
// Runs on its own localhost origin. Only share/close UI click handlers are driven.
addEventListener('load',()=>{
 const button=document.createElement('button'); button.textContent='测试原型快速开关'; button.type='button';
 button.style.cssText='position:fixed;bottom:12px;left:12px;z-index:2000;background:white;color:black;padding:12px';
 const output=document.createElement('output'); output.hidden=true; output.dataset.motionSamples='';
 document.body.append(button,output);
 button.addEventListener('click',()=>{
  if(button.disabled)return;button.disabled=true;output.textContent='';
  const started=performance.now(),samples=[],nodes=new WeakMap();let sequence=0;
  function sample(){
   const at=performance.now()-started;
   samples.push({at,masks:[...document.querySelectorAll('.modal-overlay')].map(mask=>{
    if(!nodes.has(mask))nodes.set(mask,++sequence);const dialog=mask.querySelector('.dialog');
    return {node:nodes.get(mask),opacity:getComputedStyle(mask).opacity,class:mask.className,transform:dialog?getComputedStyle(dialog).transform:'',height:dialog?.getBoundingClientRect().height};
   })});
   if(at<1650)requestAnimationFrame(sample);else{output.textContent=JSON.stringify(samples);button.disabled=false;}
  }
  requestAnimationFrame(sample);
  for(const [delay,open] of [[300,true],[420,false],[500,true],[1300,false]])setTimeout(()=>{
   const control=open?[...document.querySelectorAll('.gallery-actions button')].find(el=>el.textContent.trim()==='分享'):document.querySelector('.modal-overlay .dialog-close');
   control?.click();
  },delay);
 });
});
</script></body></html>
